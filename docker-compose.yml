services:
  cbre:
    build: .
    container_name: cbre-reporting
    restart: unless-stopped
    # Published on the host so the Cloudflare tunnel (which targets 192.168.1.158:3300) keeps working.
    # ⚠ HARDENING (do together with a tunnel-config change): for full segmentation, attach the
    #   cloudflared container to the "cbre" network below and point it at http://cbre:3000, then remove
    #   this "ports" line entirely (no host port at all) — OR bind loopback-only ("127.0.0.1:3300:3000")
    #   and repoint the tunnel to http://127.0.0.1:3300. Either removes LAN exposure of the app.
    ports:
      - "3300:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — set it in .env (e.g. openssl rand -hex 48)}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CHAT_DAILY_CAP=${CHAT_DAILY_CAP:-2000}
      - SMTP_HOST=${SMTP_HOST:-smtp.zoho.eu}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - APP_BASE_URL=${APP_BASE_URL:-https://cbre.mecflow.gr}
      - REPORT_EMAIL_DOMAINS=${REPORT_EMAIL_DOMAINS:-}
    volumes:
      - ./data:/data
    # ── Container hardening ──
    read_only: true                     # immutable root FS — only /data (volume) and /tmp (tmpfs) are writable
    tmpfs:
      - /tmp
    cap_drop:
      - ALL                             # drop all Linux capabilities (the app needs none)
    security_opt:
      - no-new-privileges:true          # a child process can never gain more privileges than its parent
    mem_limit: 512m                     # cap memory so a bug/abuse can't OOM the whole NAS
    # NOTE: "cpus" and "pids_limit" are intentionally omitted — Synology DSM kernels lack the CPU CFS
    # scheduler and PIDs-limit cgroups, so those are rejected/discarded here. Enforce CPU/PID limits at
    # the enterprise host (the target managed platform) instead. mem_limit works on DSM and is kept.
    networks:
      - cbre                            # dedicated network — NOT shared with hr-portal or other apps
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  cbre:
    name: cbre-net
