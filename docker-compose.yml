version: "3.8"

services:
  cbre:
    build: .
    container_name: cbre-reporting
    restart: unless-stopped
    ports:
      - "3300:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — set it in .env (e.g. openssl rand -hex 48)}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.zoho.eu}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - APP_BASE_URL=${APP_BASE_URL:-https://cbre.mecflow.gr}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
