<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBRE Hellas — Reporting Platform</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23003F2D'/%3E%3Ctext x='50' y='65' font-family='Helvetica' font-size='40' font-weight='700' fill='white' text-anchor='middle'%3ECBRE%3C/text%3E%3C/svg%3E" />
  <style>
    html{-webkit-text-size-adjust:100%}
    body{margin:0;font-family:Segoe UI,Tahoma,sans-serif;overflow-x:hidden}
    /* Table wrappers scroll with momentum on touch devices */
    div[style*="overflow-x"],div[style*="overflowX"]{-webkit-overflow-scrolling:touch}
    @media (max-width:640px){
      /* Inputs at ≥16px stop iOS Safari from auto-zooming on focus… */
      input,select,textarea{font-size:16px !important}
      /* …but keep the dense finance grids compact (they scroll horizontally instead) */
      table input,table select,table textarea{font-size:12px !important}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
